<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Escala do Templo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Escala do Templo</h1>

<section id="login">
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login(
    document.getElementById('usuario').value,
    document.getElementById('senha').value
  )">Entrar</button>
</section>

<hr>

<section id="escala"></section>

<script src="app.js"></script>
<script>
  async function carregarDados() {
    const dados = await api({ action: "listEscala" });
    document.getElementById("escala").innerHTML =
      dados.map(e => `
        <div>
          <strong>${e.nome_oficiante}</strong> –
          ${e.setor} –
          ${e.data} –
          Turno ${e.turno}
        </div>
      `).join("");
  }

  carregarDados();
</script>

</body>
</html>
