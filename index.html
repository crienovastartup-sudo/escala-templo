<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Escala do Templo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gray-100">

<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl">

<header class="bg-indigo-600 text-white p-5 rounded-b-3xl">
  <h1 class="text-2xl font-bold">Escala do Templo</h1>
  <p class="text-sm opacity-80">Visualização Pública • Login Administrativo</p>
</header>

<!-- LOGIN -->
<section id="loginBox" class="p-4">
  <input id="loginUser" placeholder="Usuário" class="input">
  <input id="loginPass" type="password" placeholder="Senha" class="input mt-2">
  <button onclick="login()" class="btn-primary mt-3">Entrar</button>
</section>

<!-- LOGOUT -->
<section id="logoutBox" class="hidden p-4 text-right">
  <button onclick="logout()" class="text-red-500 text-sm">Sair</button>
</section>

<!-- CALENDÁRIO -->
<main id="calendar" class="p-4 space-y-4"></main>

<button id="btnAdd" onclick="openScaleModal()"
class="hidden fixed bottom-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg">
＋
</button>

</div>

<script src="app.js"></script>
</body>
</html>
