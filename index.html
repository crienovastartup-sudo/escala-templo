<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Escala - Templo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* Cores dos Setores nos Cards do Calendário */
        .card-batisterio { background-color: #e0f2fe !important; border-color: #0ea5e9 !important; color: #0369a1 !important; }
        .card-recepcao { background-color: #fefce8 !important; border-color: #eab308 !important; color: #854d0e !important; }
        .card-selamento { background-color: #f0fdf4 !important; border-color: #22c55e !important; color: #166534 !important; }
        .card-default { background-color: #f1f5f9 !important; border-color: #94a3b8 !important; color: #475569 !important; }

        /* FullCalendar Customization */
        .fc-event { border: none !important; background: transparent !important; padding: 0 !important; margin: 1px 0 !important; }
        .fc-daygrid-event-harness { margin-bottom: 2px; }
        
        .event-card-custom {
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border-left-width: 4px;
        }
        .event-card-custom:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 10; }

        .modal-blur {
            backdrop-filter: blur(8px);
            background-color: rgba(15, 23, 42, 0.4);
        }

        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Ajuste para telas pequenas */
        @media (max-width: 640px) {
            .fc-header-toolbar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navegação -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <i data-lucide="church" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-800">Escala<span class="text-blue-600">Templo</span></span>
                </div>
                <div class="flex gap-1">
                    <button onclick="switchTab('calendar')" id="tab-calendar" class="px-4 py-2 text-sm font-medium transition-colors hover:text-blue-600 flex items-center gap-2 border-b-2 border-transparent">
                        <i data-lucide="calendar" class="w-4 h-4"></i> <span class="hidden sm:inline">Calendário</span>
                    </button>
                    <button onclick="switchTab('config')" id="tab-config" class="px-4 py-2 text-sm font-medium transition-colors hover:text-blue-600 flex items-center gap-2 border-b-2 border-transparent">
                        <i data-lucide="settings" class="w-4 h-4"></i> <span class="hidden sm:inline">Configurar</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- SEÇÃO CALENDÁRIO -->
        <section id="sec-calendar" class="space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border">
                <div class="flex flex-wrap gap-3">
                    <select id="filter-setor" class="bg-slate-50 border rounded-lg px-3 py-2 text-sm focus:ring-2 ring-blue-500 outline-none">
                        <option value="">Todos Setores</option>
                        <option value="BATISTÉRIO">Batistério</option>
                        <option value="RECEPÇÃO">Recepção</option>
                        <option value="SELAMENTO">Selamento</option>
                    </select>
                    <select id="filter-turno" class="bg-slate-50 border rounded-lg px-3 py-2 text-sm focus:ring-2 ring-blue-500 outline-none">
                        <option value="">Todos Turnos</option>
                        <option value="PRIMEIRO">Primeiro</option>
                        <option value="SEGUNDO">Segundo</option>
                        <option value="TERCEIRO">Terceiro</option>
                        <option value="MANHÃ">Manhã</option>
                        <option value="TARDE">Tarde</option>
                    </select>
                </div>
                <button onclick="generateProfessionalPDF()" class="bg-slate-800 text-white px-5 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 hover:bg-slate-700 transition-all">
                    <i data-lucide="download" class="w-4 h-4"></i> PDF Completo
                </button>
            </div>
            
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
                <div id="calendar"></div>
            </div>
        </section>

        <!-- SEÇÃO CONFIGURAR -->
        <section id="sec-config" class="hidden space-y-8">
            <div class="grid lg:grid-cols-3 gap-8">
                
                <!-- Coluna Lateral: Oficiantes -->
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="font-bold text-lg flex items-center gap-2">
                                <i data-lucide="users" class="w-5 h-5 text-blue-600"></i> Oficiantes
                            </h2>
                            <button onclick="openModal('modal-oficiante')" class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div id="oficiantes-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                            <!-- JS -->
                        </div>
                    </div>
                </div>

                <!-- Coluna Principal: Escalas -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="font-bold text-lg flex items-center gap-2">
                                <i data-lucide="clipboard-list" class="w-5 h-5 text-blue-600"></i> Gestão de Escala
                            </h2>
                            <button onclick="openEscalaModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
                                <i data-lucide="calendar-plus" class="w-4 h-4"></i> Adicionar
                            </button>
                        </div>
                        
                        <div class="overflow-x-auto rounded-xl border border-slate-100">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase">Data</th>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase">Oficiante</th>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase">Setor</th>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="escala-table-body" class="divide-y divide-slate-100">
                                    <!-- JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAIS... (Oficiante e Escala seguem os mesmos IDs do seu código) -->
    <!-- (Mantive a estrutura dos modais idêntica para não quebrar sua lógica de script) -->
    <div id="modal-oficiante" class="fixed inset-0 z-[60] hidden modal-blur flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <h3 class="text-xl font-extrabold text-slate-800">Novo Oficiante</h3>
                <button onclick="closeModal('modal-oficiante')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form id="form-oficiante" class="p-6 space-y-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Nome Completo</label>
                    <input type="text" id="oficiante-nome" required class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 ring-blue-500 outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Foto do Perfil</label>
                    <input type="file" id="oficiante-foto" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition-all">Salvar Oficiante</button>
            </form>
        </div>
    </div>

    <div id="modal-escala" class="fixed inset-0 z-[60] hidden modal-blur flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <h3 class="text-xl font-extrabold text-slate-800" id="escala-modal-title">Agendar Escala</h3>
                <button onclick="closeModal('modal-escala')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form id="form-escala" class="p-6 space-y-5">
                <input type="hidden" id="escala-id-original">
                <input type="hidden" id="escala-data-original">
                <input type="hidden" id="escala-turno-original">

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Oficiante</label>
                    <select id="escala-oficiante" required class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 ring-blue-500 outline-none">
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">Data</label>
                        <input type="date" id="escala-data" required class="w-full p-3 rounded-xl border border-slate-200">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">Setor</label>
                        <select id="escala-setor" required class="w-full p-3 rounded-xl border border-slate-200">
                            <option value="BATISTÉRIO">Batistério</option>
                            <option value="RECEPÇÃO">Recepção</option>
                            <option value="SELAMENTO">Selamento</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Turno</label>
                    <select id="escala-turno" required class="w-full p-3 rounded-xl border border-slate-200">
                        <option value="PRIMEIRO">Primeiro (07h-12h)</option>
                        <option value="SEGUNDO">Segundo (12h-17h)</option>
                        <option value="TERCEIRO">Terceiro (17h-21h)</option>
                        <option value="MANHÃ">Manhã (07h-13h)</option>
                        <option value="TARDE">Tarde (13h-19h)</option>
                    </select>
                </div>

                <div id="escala-horas-container" class="grid grid-cols-2 gap-4 hidden bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-yellow-700 uppercase">Início Personalizado</label>
                        <input type="time" id="escala-hora-inicio" class="w-full p-2 rounded-lg border">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-yellow-700 uppercase">Fim Personalizado</label>
                        <input type="time" id="escala-hora-fim" class="w-full p-2 rounded-lg border">
                    </div>
                </div>

                <button type="submit" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold hover:bg-slate-900 transition-all">Confirmar</button>
            </form>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 z-[100] bg-white/80 backdrop-blur-sm hidden flex-col items-center justify-center gap-4">
        <div class="loading-spinner"></div>
        <p class="text-slate-600 font-medium">Sincronizando...</p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz5n2N8iYhzWGH6Pz7T8aFPgMQ98s9HXLq-wmD-m7mv4vcpOqbUsztCsenJ6k6XVlNnJg/exec";
        const CLOUD_NAME = "dwlrxb6a0";
        const UPLOAD_PRESET = "ml_default";
        
        const TURNOS_HORARIOS = {
            "PRIMEIRO": { i: "07:00", f: "12:00" },
            "SEGUNDO":  { i: "12:00", f: "17:00" },
            "TERCEIRO": { i: "17:00", f: "21:00" },
            "MANHÃ":    { i: "07:00", f: "13:00" },
            "TARDE":    { i: "13:00", f: "19:00" }
        };

        let oficiantes = [];
        let escala = [];
        let calendar;

        window.onload = () => {
            lucide.createIcons();
            initCalendar();
            fetchData();
            setupListeners();
            switchTab('calendar');
        };

        function setupListeners() {
            document.getElementById('escala-setor').addEventListener('change', (e) => {
                const isRec = e.target.value.includes('RECEPÇÃO');
                document.getElementById('escala-horas-container').classList.toggle('hidden', !isRec);
            });
            ['filter-setor', 'filter-turno'].forEach(id => {
                document.getElementById(id).addEventListener('change', applyFilters);
            });
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: window.innerWidth < 768 ? 'listWeek' : 'dayGridMonth',
                locale: 'pt-br',
                height: 'auto',
                timeZone: 'UTC',
                headerToolbar: { 
                    left: 'prev,next today', 
                    center: 'title', 
                    right: 'dayGridMonth,listWeek' 
                },
                buttonText: { today: 'Hoje', month: 'Mês', list: 'Lista' },
                eventContent: function(arg) {
                    const ext = arg.event.extendedProps;
                    const setor = (ext.setor || "").toUpperCase();
                    const oficiante = oficiantes.find(o => String(o.id) === String(ext.id_oficiante)) || {};
                    
                    let colorClass = "card-default";
                    if (setor.includes("BATISTÉRIO")) colorClass = "card-batisterio";
                    else if (setor.includes("RECEPÇÃO")) colorClass = "card-recepcao";
                    else if (setor.includes("SELAMENTO")) colorClass = "card-selamento";

                    return { html: `
                        <div class="event-card-custom ${colorClass} rounded-lg p-1.5 flex items-center gap-2 overflow-hidden w-full">
                            <img src="${oficiante.foto1 || 'https://via.placeholder.com/32'}" 
                                 onerror="this.src='https://via.placeholder.com/32'"
                                 class="w-8 h-8 rounded-full object-cover border-2 border-white/50 shadow-sm flex-shrink-0">
                            <div class="min-w-0 flex-1">
                                <div class="font-bold text-[10px] sm:text-[11px] truncate leading-tight">${arg.event.title}</div>
                                <div class="text-[8px] sm:text-[9px] opacity-80 font-medium truncate uppercase">${ext.setor} • ${ext.turno}</div>
                            </div>
                        </div>
                    `};
                }
            });
            calendar.render();
        }

        async function apiCall(payload) {
            showLoading(true);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                return await res.json();
            } catch (e) {
                return { status: "error" };
            } finally {
                showLoading(false);
            }
        }

        async function fetchData() {
            const rO = await apiCall({ action: "listOficiantes" });
            if (rO.status === "ok") {
                oficiantes = rO.data;
                renderOficiantes();
                updateOficianteSelects();
            }
            const rE = await apiCall({ action: "listEscala" });
            if (rE.status === "ok") {
                escala = rE.data;
                renderEscalaTable();
                applyFilters();
            }
        }

        function renderOficiantes() {
            const container = document.getElementById('oficiantes-list');
            container.innerHTML = oficiantes.map(o => `
                <div class="bg-white p-3 rounded-xl border border-slate-100 flex items-center gap-3 hover:bg-slate-50 transition-colors">
                    <img src="${o.foto1 || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover shadow-sm border border-slate-200">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-slate-800 truncate">${o.nome}</p>
                    </div>
                    <button onclick="deleteOficiante('${o.id}')" class="p-2 text-slate-300 hover:text-red-500 transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderEscalaTable() {
            const tbody = document.getElementById('escala-table-body');
            tbody.innerHTML = [...escala].sort((a,b) => a.data.localeCompare(b.data)).map(e => {
                const info = formatarDataLimpa(e.data);
                return `
                    <tr class="hover:bg-slate-50 transition-colors group">
                        <td class="p-4">
                            <div class="text-sm font-bold text-slate-800">${info.dataFormatada}</div>
                            <div class="text-[10px] text-slate-400 font-semibold uppercase">${info.diaSemana}</div>
                        </td>
                        <td class="p-4 text-sm font-medium text-slate-600">${e.nome_oficiante}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 bg-slate-100 text-[9px] font-bold rounded uppercase text-slate-500">${e.setor}</span>
                            <div class="text-[10px] mt-1 font-semibold text-blue-600">${e.turno}</div>
                        </td>
                        <td class="p-4 text-right">
                            <div class="flex justify-end gap-1">
                                <button onclick='editEscalaItem(${JSON.stringify(e)})' class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteEscalaItem('${e.id_oficiante}', '${e.data.substring(0,10)}', '${e.turno}')" class="p-2 text-red-400 hover:bg-red-50 rounded-lg">
                                    <i data-lucide="trash" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        function formatarDataLimpa(dataStr) {
            if (!dataStr) return { dataFormatada: "---", diaSemana: "---" };
            const p = dataStr.substring(0, 10).split('-');
            const d = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]), 12, 0, 0);
            const dias = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
            return {
                dataFormatada: `${p[2]}/${p[1]}/${p[0]}`,
                diaSemana: dias[d.getDay()]
            };
        }

        function applyFilters() {
            const fS = document.getElementById('filter-setor').value;
            const fT = document.getElementById('filter-turno').value;
            calendar.removeAllEvents();
            escala.filter(item => (!fS || item.setor === fS) && (!fT || item.turno === fT))
                  .forEach(e => {
                      calendar.addEvent({
                          title: e.nome_oficiante,
                          start: e.data.substring(0, 10),
                          allDay: true,
                          extendedProps: { ...e }
                      });
                  });
        }

        // PDF e Handlers de Formulário seguem a mesma lógica...
        window.generateProfessionalPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("Escala Oficial do Templo", 15, 20);
            doc.setFontSize(10);
            doc.text(`Gerado em: ${new Date().toLocaleString()}`, 15, 26);

            const tableRows = escala.sort((a,b) => a.data.localeCompare(b.data)).map(e => [
                formatarDataLimpa(e.data).dataFormatada, e.nome_oficiante, e.setor, e.turno
            ]);

            doc.autoTable({
                head: [['Data', 'Oficiante', 'Setor', 'Turno']],
                body: tableRows,
                startY: 35,
                theme: 'grid'
            });
            doc.save("escala_templo.pdf");
        };

        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        window.openEscalaModal = () => {
            document.getElementById('form-escala').reset();
            document.getElementById('escala-id-original').value = '';
            document.getElementById('escala-modal-title').innerText = "Agendar Escala";
            openModal('modal-escala');
        };

        window.editEscalaItem = (item) => {
            openEscalaModal();
            document.getElementById('escala-modal-title').innerText = "Editar";
            const clean = item.data.substring(0, 10);
            document.getElementById('escala-id-original').value = item.id_oficiante;
            document.getElementById('escala-data-original').value = clean;
            document.getElementById('escala-turno-original').value = item.turno;
            document.getElementById('escala-oficiante').value = item.id_oficiante;
            document.getElementById('escala-data').value = clean;
            document.getElementById('escala-setor').value = item.setor;
            document.getElementById('escala-turno').value = item.turno;
            document.getElementById('escala-setor').dispatchEvent(new Event('change'));
        };

        document.getElementById('form-oficiante').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            const file = document.getElementById('oficiante-foto').files[0];
            let fotoUrl = "";
            if (file) {
                const fd = new FormData();
                fd.append("file", file);
                fd.append("upload_preset", UPLOAD_PRESET);
                const up = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
                const resUp = await up.json();
                fotoUrl = resUp.secure_url || "";
            }
            const res = await apiCall({ action: "addOficiante", nome: document.getElementById('oficiante-nome').value, foto1: fotoUrl });
            if (res.status === "ok") { closeModal('modal-oficiante'); fetchData(); e.target.reset(); }
            btn.disabled = false;
        };

        document.getElementById('form-escala').onsubmit = async (e) => {
            e.preventDefault();
            const ofi = document.getElementById('escala-oficiante');
            const turno = document.getElementById('escala-turno').value;
            const idOrig = document.getElementById('escala-id-original').value;
            const payload = {
                action: idOrig ? "updateEscala" : "addEscala",
                data: document.getElementById('escala-data').value,
                id_oficiante: ofi.value,
                nome_oficiante: ofi.options[ofi.selectedIndex].text,
                setor: document.getElementById('escala-setor').value,
                turno,
                id_original: idOrig,
                data_original: document.getElementById('escala-data-original').value,
                turno_original: document.getElementById('escala-turno-original').value
            };
            const res = await apiCall(payload);
            if (res.status === "ok") { closeModal('modal-escala'); fetchData(); }
        };

        window.deleteOficiante = async (id) => {
            if(confirm("Excluir oficiante?")) {
                const res = await apiCall({ action: "deleteOficiante", id });
                if(res.status === "ok") fetchData();
            }
        };

        window.deleteEscalaItem = async (id, data, turno) => {
            if(confirm("Remover da escala?")) {
                const res = await apiCall({ action: "deleteEscala", id_oficiante: id, data, turno });
                if(res.status === "ok") fetchData();
            }
        };

        function updateOficianteSelects() {
            const html = '<option value="">Selecione...</option>' + 
                oficiantes.map(o => `<option value="${o.id}">${o.nome}</option>`).join('');
            document.getElementById('escala-oficiante').innerHTML = html;
        }

        window.switchTab = (tab) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            if (tab === 'calendar' && calendar) setTimeout(() => calendar.updateSize(), 300);
        };

        function showLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
