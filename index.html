<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Escala - Templo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card-batisterio { background-color: #e0f2fe !important; border-color: #0ea5e9 !important; color: #0369a1 !important; }
        .card-recepcao { background-color: #fefce8 !important; border-color: #eab308 !important; color: #854d0e !important; }
        .card-selamento { background-color: #f0fdf4 !important; border-color: #22c55e !important; color: #166534 !important; }
        .card-default { background-color: #f1f5f9 !important; border-color: #94a3b8 !important; color: #475569 !important; }
        .fc-event { border: none !important; background: transparent !important; padding: 0 !important; margin: 1px 0 !important; }
        .event-card-custom { transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border-left-width: 4px; }
        .modal-blur { backdrop-filter: blur(8px); background-color: rgba(15, 23, 42, 0.4); }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobile Optimization for Calendar */
        @media (max-width: 640px) {
            .fc-toolbar-title { font-size: 1.1rem !important; }
            .fc-header-toolbar { flex-direction: column; gap: 10px; }
            .fc-view-harness { height: 600px !important; }
            .event-card-custom { padding: 4px !important; }
            .event-card-custom span { font-size: 9px !important; }
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="church" class="text-white w-6 h-6"></i></div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-800">Escala<span class="text-blue-600">Templo</span></span>
                </div>
                <div class="flex gap-1">
                    <button onclick="switchTab('calendar')" id="tab-calendar" class="px-4 py-2 text-sm font-medium transition-colors hover:text-blue-600 flex items-center gap-2 border-b-2 border-transparent">
                        <i data-lucide="calendar" class="w-4 h-4"></i> <span class="hidden sm:inline">Calendário</span>
                    </button>
                    <button onclick="switchTab('config')" id="tab-config" class="px-4 py-2 text-sm font-medium transition-colors hover:text-blue-600 flex items-center gap-2 border-b-2 border-transparent">
                        <i data-lucide="settings" class="w-4 h-4"></i> <span class="hidden sm:inline">Configurar</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section id="sec-calendar" class="space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border">
                <div class="flex flex-wrap gap-3">
                    <select id="filter-setor" class="bg-slate-50 border rounded-lg px-3 py-2 text-sm focus:ring-2 ring-blue-500 outline-none">
                        <option value="">Todos Setores</option>
                        <option value="BATISTÉRIO">Batistério</option>
                        <option value="RECEPÇÃO">Recepção</option>
                        <option value="SELAMENTO">Selamento</option>
                    </select>
                    <select id="filter-turno" class="bg-slate-50 border rounded-lg px-3 py-2 text-sm focus:ring-2 ring-blue-500 outline-none">
                        <option value="">Todos Turnos</option>
                        <option value="PRIMEIRO">Primeiro</option>
                        <option value="SEGUNDO">Segundo</option>
                        <option value="TERCEIRO">Terceiro</option>
                    </select>
                    <select id="filter-oficiante" class="bg-slate-50 border rounded-lg px-3 py-2 text-sm focus:ring-2 ring-blue-500 outline-none">
                        <option value="">Todos Oficiantes</option>
                    </select>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="relatorioCalendarioLista()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 hover:bg-slate-700 transition-all">
                        <i data-lucide="file-text" class="w-4 h-4"></i> Lista
                    </button>
                    <button onclick="relatorioCalendarioAgrupadoData()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 hover:bg-slate-700 transition-all">
                        <i data-lucide="layers" class="w-4 h-4"></i> Por Data
                    </button>
                    <button onclick="relatorioEscalaPorOficiante()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 hover:bg-slate-700 transition-all">
                        <i data-lucide="user-check" class="w-4 h-4"></i> Por Oficiante
                    </button>
                </div>
            </div>
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
                <div id="calendar"></div>
            </div>
        </section>

        <section id="sec-config" class="hidden space-y-8">
            <div class="grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-blue-600"></i> Oficiantes</h2>
                            <button onclick="openOficianteModal()" class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100"><i data-lucide="plus" class="w-5 h-5"></i></button>
                        </div>
                        <div id="oficiantes-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-2"></div>
                    </div>
                </div>
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="clipboard-list" class="w-5 h-5 text-blue-600"></i> Gestão de Escala</h2>
                            <button onclick="openEscalaModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-blue-700 shadow-lg shadow-blue-200">
                                <i data-lucide="calendar-plus" class="w-4 h-4"></i> Adicionar
                            </button>
                        </div>
                        <div class="overflow-x-auto rounded-xl border border-slate-100">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase">Data</th>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase">Oficiante</th>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase">Setor</th>
                                        <th class="p-4 text-xs font-bold text-slate-500 uppercase text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="escala-table-body" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Oficiante (Novo/Editar) -->
    <div id="modal-oficiante" class="fixed inset-0 z-[60] hidden modal-blur flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <h3 class="text-xl font-extrabold text-slate-800" id="oficiante-modal-title">Novo Oficiante</h3>
                <button onclick="closeModal('modal-oficiante')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <form id="form-oficiante" class="p-6 space-y-4">
                <input type="hidden" id="oficiante-id">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Nome Completo</label>
                    <input type="text" id="oficiante-nome" required class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">Foto 1</label>
                        <input type="file" id="oficiante-foto1" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700">
                        <div id="prev-foto1" class="hidden text-[10px] text-blue-600 mt-1 truncate">Arquivo já vinculado</div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">Foto 2</label>
                        <input type="file" id="oficiante-foto2" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700">
                        <div id="prev-foto2" class="hidden text-[10px] text-blue-600 mt-1 truncate">Arquivo já vinculado</div>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700">Salvar Oficiante</button>
            </form>
        </div>
    </div>

    <!-- Modal Escala (Novo/Editar) -->
    <div id="modal-escala" class="fixed inset-0 z-[60] hidden modal-blur flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <h3 class="text-xl font-extrabold text-slate-800" id="escala-modal-title">Agendar Escala</h3>
                <button onclick="closeModal('modal-escala')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <form id="form-escala" class="p-6 space-y-5">
                <input type="hidden" id="escala-id-original">
                <input type="hidden" id="escala-data-original">
                <input type="hidden" id="escala-turno-original">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Oficiante</label>
                    <select id="escala-oficiante" required class="w-full p-3 rounded-xl border border-slate-200 outline-none"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">Data</label>
                        <input type="date" id="escala-data" required class="w-full p-3 rounded-xl border border-slate-200">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">Setor</label>
                        <select id="escala-setor" required class="w-full p-3 rounded-xl border border-slate-200">
                            <option value="BATISTÉRIO">Batistério</option>
                            <option value="RECEPÇÃO">Recepção</option>
                            <option value="SELAMENTO">Selamento</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase">Turno</label>
                    <select id="escala-turno" required class="w-full p-3 rounded-xl border border-slate-200">
                        <option value="PRIMEIRO">Primeiro (07h-12h)</option>
                        <option value="SEGUNDO">Segundo (12h-17h)</option>
                        <option value="TERCEIRO">Terceiro (17h-21h)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold hover:bg-slate-900 transition-all">Confirmar e Salvar</button>
            </form>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 z-[100] bg-white/80 backdrop-blur-sm hidden flex flex-col items-center justify-center gap-4">
        <div class="loading-spinner"></div>
        <p class="text-slate-600 font-medium">Sincronizando...</p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz5n2N8iYhzWGH6Pz7T8aFPgMQ98s9HXLq-wmD-m7mv4vcpOqbUsztCsenJ6k6XVlNnJg/exec";
        const CLOUD_NAME = "dwlrxb6a0";
        const UPLOAD_PRESET = "ml_default";
        
        let oficiantes = [];
        let escala = [];
        let calendar;

        window.onload = () => {
            lucide.createIcons();
            initCalendar();
            fetchData();
            setupListeners();
            switchTab('calendar');
        };

        function setupListeners() {
            ['filter-setor', 'filter-turno', 'filter-oficiante'].forEach(id => {
                document.getElementById(id).addEventListener('change', applyFilters);
            });
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            
            // Mapeamento de pesos para garantir a ordem correta
            const pesosTurno = {
                'PRIMEIRO': 1,
                'SEGUNDO': 2,
                'TERCEIRO': 3
            };
        
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'pt-br',
                height: 'auto',
                headerToolbar: { 
                    left: 'prev,next today', 
                    center: 'title', 
                    right: 'dayGridMonth,listWeek' 
                },
                buttonText: { today: 'Hoje', month: 'Mês', list: 'Lista' },
                
                // REGRA DE OURO: O eventOrder procura a propriedade no nível superior do objeto do evento
                eventOrder: "ordemTurno",
        
                // Evento de clique para criar o efeito "flutuante"
                eventClick: function(info) {
                    // Remove o destaque de qualquer outro card selecionado anteriormente
                    document.querySelectorAll('.event-card-selected').forEach(el => {
                        el.classList.remove('event-card-selected', 'scale-105', 'z-50', 'shadow-xl');
                    });
        
                    // Adiciona classes de destaque ao card clicado
                    const cardElement = info.el.querySelector('.event-card-custom');
                    if (cardElement) {
                        cardElement.classList.add('event-card-selected', 'scale-105', 'z-50', 'shadow-xl');
                        
                        // Opcional: Fechar o destaque ao clicar fora (precisa de tratamento global)
                        info.jsEvent.stopPropagation();
                    }
        
                    // Se houver uma função de edição de escala, você pode chamá-la aqui
                    if (typeof editEscalaItem === 'function') {
                        editEscalaItem(info.event.extendedProps);
                    }
                },
        
                // Garante que ao transformar dados (caso venham via link direto) a ordem seja injetada
                eventDataTransform: function(eventData) {
                    eventData.ordemTurno = pesosTurno[String(eventData.turno).toUpperCase()] || 99;
                    return eventData;
                },
        
                eventContent: function(arg) {
                    const ext = arg.event.extendedProps;
                    const setor = (ext.setor || "").toUpperCase();
                    const oficiante = oficiantes.find(o => String(o.id) === String(ext.id_oficiante)) || {};
                    
                    let colorClass = "card-default";
                    if (setor.includes("BATISTÉRIO")) colorClass = "card-batisterio";
                    else if (setor.includes("RECEPÇÃO")) colorClass = "card-recepcao";
                    else if (setor.includes("SELAMENTO")) colorClass = "card-selamento";
        
                    return { html: `
                        <div class="event-card-custom ${colorClass} rounded-lg p-1.5 overflow-hidden w-full flex flex-col gap-1 transition-all duration-300">
                            <div class="flex items-center gap-1.5">
                                <img src="${oficiante.foto1 || 'https://via.placeholder.com/36'}" class="w-9 h-9 rounded-full object-cover border-2 border-white shadow-sm">
                                <img src="${oficiante.foto2 || 'https://via.placeholder.com/36'}" class="w-9 h-9 rounded-full object-cover border-2 border-white shadow-sm -ml-3">
                                <span class="font-bold text-[10px] leading-tight truncate flex-1">${arg.event.title}</span>
                            </div>
                            <div class="text-[9px] opacity-90 font-medium truncate uppercase border-t border-black/5 pt-0.5">
                                ${ext.turno} • ${ext.setor}
                            </div>
                        </div>
                    `};
                }
            });
            calendar.render();
        
            // Listener global para remover o destaque ao clicar fora do calendário
            document.addEventListener('click', () => {
                document.querySelectorAll('.event-card-selected').forEach(el => {
                    el.classList.remove('event-card-selected', 'scale-105', 'z-50', 'shadow-xl');
                });
            });
        }

        async function apiCall(payload) {
            showLoading(true);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                return await res.json();
            } catch (e) { return { status: "error" }; } finally { showLoading(false); }
        }

        async function fetchData() {
            const rO = await apiCall({ action: "listOficiantes" });
            if (rO.status === "ok") {
                oficiantes = rO.data;
                renderOficiantes();
                updateOficianteSelects();
            }
            const rE = await apiCall({ action: "listEscala" });
            if (rE.status === "ok") {
                escala = rE.data;
                renderEscalaTable();
                applyFilters();
            }
        }

        function renderOficiantes() {
            document.getElementById('oficiantes-list').innerHTML = oficiantes.map(o => `
                <div class="bg-white p-3 rounded-xl border border-slate-100 flex items-center gap-3 hover:bg-slate-50 group">
                    <div class="flex -space-x-2">
                        <img src="${o.foto1 || 'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full object-cover border-2 border-white">
                        <img src="${o.foto2 || 'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full object-cover border-2 border-white">
                    </div>
                    <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800 truncate">${o.nome}</p></div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick='editOficiante(${JSON.stringify(o)})' class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg"><i data-lucide="edit" class="w-4 h-4"></i></button>
                        <button onclick="deleteOficiante('${o.id}')" class="p-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderEscalaTable() {
            const tbody = document.getElementById('escala-table-body');
            tbody.innerHTML = [...escala].sort((a,b) => a.data.localeCompare(b.data)).map(e => {
                const info = formatarDataLimpa(e.data);
                return `
                    <tr class="hover:bg-slate-50 group">
                        <td class="p-4"><div class="text-sm font-bold">${info.dataFormatada}</div><div class="text-[10px] text-slate-400 uppercase">${info.diaSemana}</div></td>
                        <td class="p-4 text-sm font-medium text-slate-600">${e.nome_oficiante}</td>
                        <td class="p-4"><span class="px-2 py-1 bg-slate-100 text-[9px] font-bold rounded uppercase">${e.setor}</span><div class="text-[10px] mt-1 font-semibold text-blue-600">${e.turno}</div></td>
                        <td class="p-4 text-right">
                            <button onclick='editEscalaItem(${JSON.stringify(e)})' class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteEscalaItem('${e.id_oficiante}', '${e.data.substring(0,10)}', '${e.turno}')" class="p-2 text-red-400 hover:bg-red-50 rounded-lg"><i data-lucide="trash" class="w-4 h-4"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        function formatarDataLimpa(dataStr) {
            if (!dataStr) return { dataFormatada: "---", diaSemana: "---" };
            const p = dataStr.substring(0, 10).split('-');
            const d = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]), 12, 0, 0);
            const dias = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
            return { dataFormatada: `${p[2]}/${p[1]}/${p[0]}`, diaSemana: dias[d.getDay()] };
        }

        /**
         * IMPORTANTE: Substitua sua função applyFilters por esta abaixo.
         * É aqui que a mágica da ordenação acontece quando você filtra os dados.
         */
        function applyFilters() {
            const fS = document.getElementById('filter-setor').value;
            const fT = document.getElementById('filter-turno').value;
            const fO = document.getElementById('filter-oficiante').value;
            
            if (!calendar) return;
            calendar.removeAllEvents();
        
            const pesosTurno = { 'PRIMEIRO': 1, 'SEGUNDO': 2, 'TERCEIRO': 3 };
        
            escala.filter(item => 
                (!fS || item.setor === fS) && 
                (!fT || item.turno === fT) && 
                (!fO || String(item.id_oficiante) === String(fO))
            ).forEach(e => {
                calendar.addEvent({ 
                    title: e.nome_oficiante, 
                    start: e.data.substring(0, 10), 
                    allDay: true, 
                    // INJEÇÃO DA ORDEM: Sem isso no primeiro nível, o calendar não ordena.
                    ordemTurno: pesosTurno[String(e.turno).toUpperCase()] || 99,
                    extendedProps: { ...e } 
                });
            });
        }

        function getFilteredData() {
            const fS = document.getElementById('filter-setor').value;
            const fT = document.getElementById('filter-turno').value;
            const fO = document.getElementById('filter-oficiante').value;
            
            // Obtém período visível no calendário
            const view = calendar.view;
            const start = view.activeStart;
            const end = view.activeEnd;

            return escala.filter(item => {
                const itemDate = new Date(item.data.substring(0, 10) + "T12:00:00");
                const matchesFilters = (!fS || item.setor === fS) && 
                                       (!fT || item.turno === fT) && 
                                       (!fO || String(item.id_oficiante) === String(fO));
                const matchesDate = itemDate >= start && itemDate < end;
                return matchesFilters && matchesDate;
            });
        }

        // --- RELATÓRIOS PDF ---

        window.relatorioCalendarioLista = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const turnosOrder = { "PRIMEIRO": 1, "SEGUNDO": 2, "TERCEIRO": 3 };
            const data = getFilteredData().sort((a,b) => a.data.localeCompare(b.data) || turnosOrder[a.turno] - turnosOrder[b.turno]);
            
            doc.setFontSize(16); doc.text("Escala: Calendário em Lista", 14, 15);
            doc.setFontSize(10); doc.text(`Filtro: ${calendar.view.title}`, 14, 22);
            const rows = data.map(e => [formatarDataLimpa(e.data).dataFormatada, e.turno, e.setor, e.nome_oficiante]);
            doc.autoTable({ head: [['Data', 'Turno', 'Setor', 'Oficiante']], body: rows, startY: 28 });
            doc.save(`escala_lista_${calendar.view.title.replace(/ /g, '_')}.pdf`);
        };

        window.relatorioCalendarioAgrupadoData = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const data = getFilteredData().sort((a,b) => a.data.localeCompare(b.data));
            const grouped = {};
            data.forEach(e => { if(!grouped[e.data]) grouped[e.data] = []; grouped[e.data].push(e); });

            doc.setFontSize(16); doc.text("Escala Agrupada por Data", 14, 15);
            doc.setFontSize(10); doc.text(`Período: ${calendar.view.title}`, 14, 22);
            let y = 30;
            Object.keys(grouped).forEach(dateKey => {
                const info = formatarDataLimpa(dateKey);
                doc.setFontSize(11); doc.setTextColor(40);
                doc.text(`${info.dataFormatada} (${info.diaSemana})`, 14, y);
                y += 2;
                const rows = grouped[dateKey].map(e => [e.nome_oficiante, e.turno, e.setor]);
                doc.autoTable({ head: [['Oficiante', 'Turno', 'Setor']], body: rows, startY: y + 2, margin: { left: 14 } });
                y = doc.lastAutoTable.finalY + 10;
                if(y > 270) { doc.addPage(); y = 20; }
            });
            doc.save("escala_agrupada_data.pdf");
        };

        window.relatorioEscalaPorOficiante = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const data = getFilteredData();
            const oficiantesIds = [...new Set(data.map(e => e.id_oficiante))];

            doc.setFontSize(16); doc.text("Escala por Oficiante", 14, 15);
            doc.setFontSize(10); doc.text(`Período: ${calendar.view.title}`, 14, 22);
            let y = 30;

            oficiantesIds.forEach(id => {
                const itens = data.filter(e => e.id_oficiante === id).sort((a,b) => a.data.localeCompare(b.data));
                const nome = itens[0].nome_oficiante;

                doc.setDrawColor(200); doc.setFillColor(245, 247, 250);
                doc.rect(14, y, 182, 8, 'F');
                doc.setFontSize(12); doc.setTextColor(0); doc.text(nome, 16, y + 6);
                y += 10;

                const rows = itens.map(e => [formatarDataLimpa(e.data).dataFormatada, e.turno, e.setor]);
                doc.autoTable({ head: [['Data', 'Turno', 'Setor']], body: rows, startY: y, margin: { left: 14 }, theme: 'striped' });
                y = doc.lastAutoTable.finalY + 10;
                if(y > 250) { doc.addPage(); y = 20; }
            });
            doc.save("escala_por_oficiante.pdf");
        };

        // --- ACTIONS ---

        async function uploadFile(file) {
            if(!file) return "";
            const fd = new FormData();
            fd.append("file", file); fd.append("upload_preset", UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
            const data = await res.json();
            return data.secure_url || "";
        }

        window.openOficianteModal = () => {
            document.getElementById('form-oficiante').reset();
            document.getElementById('oficiante-id').value = '';
            document.getElementById('oficiante-modal-title').innerText = 'Novo Oficiante';
            document.getElementById('prev-foto1').classList.add('hidden');
            document.getElementById('prev-foto2').classList.add('hidden');
            openModal('modal-oficiante');
        };

        window.editOficiante = (o) => {
            document.getElementById('oficiante-id').value = o.id;
            document.getElementById('oficiante-nome').value = o.nome;
            document.getElementById('oficiante-modal-title').innerText = 'Editar Oficiante';
            if(o.foto1) document.getElementById('prev-foto1').classList.remove('hidden');
            if(o.foto2) document.getElementById('prev-foto2').classList.remove('hidden');
            openModal('modal-oficiante');
        };

        document.getElementById('form-oficiante').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('oficiante-id').value;
            const f1File = document.getElementById('oficiante-foto1').files[0];
            const f2File = document.getElementById('oficiante-foto2').files[0];
            
            let f1 = f1File ? await uploadFile(f1File) : "";
            let f2 = f2File ? await uploadFile(f2File) : "";

            // Se for edição e não subiu nova foto, mantém a antiga (o backend precisa tratar isso ou enviamos a URL atual)
            // Para simplicidade, assumimos que se o campo estiver vazio na edição o backend mantém.
            
            const payload = { 
                action: id ? "updateOficiante" : "addOficiante", 
                id, 
                nome: document.getElementById('oficiante-nome').value, 
                foto1: f1, 
                foto2: f2 
            };
            
            const res = await apiCall(payload);
            if (res.status === "ok") { closeModal('modal-oficiante'); fetchData(); e.target.reset(); }
        };

        document.getElementById('form-escala').onsubmit = async (e) => {
            e.preventDefault();
            const ofi = document.getElementById('escala-oficiante');
            const idOrig = document.getElementById('escala-id-original').value;
            
            const payload = {
                action: idOrig ? "updateEscala" : "addEscala",
                data: document.getElementById('escala-data').value,
                id_oficiante: ofi.value,
                nome_oficiante: ofi.options[ofi.selectedIndex].text,
                setor: document.getElementById('escala-setor').value,
                turno: document.getElementById('escala-turno').value,
                id_original: idOrig,
                data_original: document.getElementById('escala-data-original').value,
                turno_original: document.getElementById('escala-turno-original').value
            };
            
            const res = await apiCall(payload);
            if (res.status === "ok") { closeModal('modal-escala'); fetchData(); }
        };

        window.deleteOficiante = async (id) => {
            if(confirm("Deseja realmente excluir este oficiante? Isso não removerá escalas passadas, mas impedirá novas.")) {
                const res = await apiCall({ action: "deleteOficiante", id });
                if(res.status === "ok") fetchData();
            }
        };

        window.deleteEscalaItem = async (id, data, turno) => {
            if(confirm("Remover este item da escala?")) {
                const res = await apiCall({ action: "deleteEscala", id_oficiante: id, data, turno });
                if(res.status === "ok") fetchData();
            }
        };

        function updateOficianteSelects() {
            const options = '<option value="">Selecione...</option>' + oficiantes.map(o => `<option value="${o.id}">${o.nome}</option>`).join('');
            document.getElementById('escala-oficiante').innerHTML = options;
            document.getElementById('filter-oficiante').innerHTML = '<option value="">Todos Oficiantes</option>' + oficiantes.map(o => `<option value="${o.id}">${o.nome}</option>`).join('');
        }

        window.switchTab = (tab) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            if (tab === 'calendar' && calendar) setTimeout(() => calendar.updateSize(), 300);
        };

        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        
        window.openEscalaModal = () => { 
            document.getElementById('form-escala').reset(); 
            document.getElementById('escala-id-original').value = ''; 
            document.getElementById('escala-modal-title').innerText = 'Agendar Escala';
            openModal('modal-escala'); 
        };

        window.editEscalaItem = (item) => { 
            openEscalaModal();
            document.getElementById('escala-modal-title').innerText = 'Editar Escala';
            document.getElementById('escala-id-original').value = item.id_oficiante;
            document.getElementById('escala-data-original').value = item.data.substring(0, 10);
            document.getElementById('escala-turno-original').value = item.turno;
            
            document.getElementById('escala-oficiante').value = item.id_oficiante;
            document.getElementById('escala-data').value = item.data.substring(0, 10);
            document.getElementById('escala-setor').value = item.setor;
            document.getElementById('escala-turno').value = item.turno;
        };

        function showLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
