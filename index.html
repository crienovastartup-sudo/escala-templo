<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Escala de Oficiantes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">

  <!-- HEADER -->
  <header class="bg-indigo-700 text-white p-5 rounded-b-3xl">
    <h1 class="text-2xl font-bold">Escala Digital</h1>
    <p class="text-indigo-100 text-sm">Templo • Oficiantes</p>
  </header>

  <!-- LOGIN -->
  <section id="loginBox" class="p-4">
    <h2 class="font-bold mb-3">Login Administrativo</h2>
    <input id="loginNome" placeholder="Usuário" class="input" />
    <input id="loginSenha" type="password" placeholder="Senha" class="input mt-2" />
    <button onclick="login()" class="btn-primary mt-3 w-full">Entrar</button>
  </section>

  <!-- CONTEÚDO -->
  <main id="content" class="flex-grow p-4 hidden"></main>

  <!-- NAV -->
  <nav class="flex justify-around p-3 border-t bg-white">
    <button onclick="loadEscala()"><i class="fa fa-calendar"></i></button>
    <button onclick="loadOficiantes()"><i class="fa fa-users"></i></button>
    <button onclick="logout()"><i class="fa fa-sign-out-alt"></i></button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
