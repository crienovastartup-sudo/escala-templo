<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Escala do Templo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow flex flex-col">

  <!-- HEADER -->
  <header class="bg-indigo-700 text-white p-4">
    <h1 class="text-xl font-bold">Escala do Templo</h1>
    <p class="text-sm opacity-80">Oficiantes</p>
  </header>

  <!-- LOGIN -->
  <section id="loginBox" class="p-4">
    <h2 class="font-bold mb-3">Login Administrativo</h2>
    <input id="loginNome" placeholder="Usuário" class="input">
    <input id="loginSenha" type="password" placeholder="Senha" class="input mt-2">
    <button onclick="login()" class="btn mt-3 w-full">Entrar</button>
  </section>

  <!-- CONTEÚDO -->
  <main id="content" class="flex-grow p-4 hidden"></main>

  <!-- NAV -->
  <nav class="flex justify-around p-3 border-t">
    <button onclick="loadEscala()">Escala</button>
    <button onclick="loadOficiantes()">Oficiantes</button>
    <button onclick="logout()">Sair</button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
